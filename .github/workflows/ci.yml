name: ci

on:
  push:
  pull_request:

env:
  LHA_MODEL: fake  # CI never calls a real model

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lha
          POSTGRES_PASSWORD: lha
          POSTGRES_DB: lha
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lha"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff format --check . && uv run ruff check .
      - name: Tests (includes full runs and a crash-and-resume run)
        run: uv run pytest -q
      - name: Full run, default faults
        run: uv run python -m lha.run --seed 42 --quiet
      - name: Full run, heavy faults
        run: uv run python -m lha.run --seed 7 --chaos 0.3 --quiet
      - name: Benchmark, one seed
        run: uv run python -m lha.bench --seeds 1 --hosts 20
      - name: Verified research on the mock web, the second domain
        run: uv run python -m lha.run --domain research --seed 42 --goal all --quiet
      - name: Code work on the mock repository, the third domain
        run: uv run python -m lha.run --domain code --seed 42 --goal all --quiet
      - name: Batch extraction from the mock invoices, the fourth domain
        run: uv run python -m lha.run --domain extract --seed 42 --goal all --quiet

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Postgres and one full run with docker compose
        run: docker compose up --build --exit-code-from lha
      - name: A run on two containers, where the helper joins the home's run and does its work
        shell: bash  # with pipefail, so a failed run fails the step
        run: |
          docker compose --profile join build home helper
          docker compose --profile join up --detach helper
          docker compose --profile join run --rm --use-aliases home | tee join.log
          test "$(timeout 120 docker wait "$(docker compose --profile join ps --all --quiet helper)")" = 0
          docker compose --profile join logs helper
          grep -q "verdict=PASS" join.log && grep -q "machines: home (its home), helper" join.log

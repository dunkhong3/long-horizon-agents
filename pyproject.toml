[project]
name = "lha"
version = "0.1.0"
description = "Multi-agent system that stays coherent over long horizons"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-ai-slim>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Real models are opt-in (--model), and runs use the fake model without these.
models = ["pydantic-ai-slim[anthropic,openai]>=1.0"]
# The MCP server (lha mcp), so an assistant such as Claude Code can hand research to lha.
mcp = ["mcp>=2.3,<3"]

[project.scripts]
lha = "lha.cli:main"

[dependency-groups]
dev = ["mcp>=2.3,<3", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lha"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

# Sorting support tickets, a domain loaded from configuration (lha/domains/config).
#
# The first stage says what each ticket is about, and the second, which
# needs the first, routes it to a team with a priority, with what the first
# stage found in its prompt. The tickets below are its own documents, which
# are its mock world, and each says which values it states, so a run on them
# is scored. With --docs it reads a folder of real tickets instead, which
# needs a real model.
#
#     just start --domain tickets
#     uv run lha start --domain tickets --docs ~/tickets --model anthropic:claude-sonnet-5-5

name = "tickets"
description = "support tickets sorted by what they are about and routed to a team"

[[stage]]
name = "classify"
instructions = "Say who wrote the ticket, which product it is about and what kind of request it is."

  [[stage.field]]
  name = "customer"
  form = "the name of the person who wrote the ticket"

  [[stage.field]]
  name = "product"
  form = "the product the ticket is about"

  [[stage.field]]
  name = "category"
  one_of = ["bug", "billing", "feature request", "account"]

[[stage]]
name = "route"
needs = ["classify"]
instructions = "Route the ticket to the team that should answer it, and say how urgent it is."

  [[stage.field]]
  name = "team"
  one_of = ["engineering", "finance", "product", "support"]

  [[stage.field]]
  name = "priority"
  one_of = ["low", "normal", "urgent"]

# The writer only sees the counts, which say how much was read and not what
# each ticket holds, so its instructions ask for what the counts can tell,
# and the table under its summary is what says where each ticket went.
[report]
instructions = "Say in two or three sentences how many tickets were read, and how many values are missing or in conflict."

[[document]]
name = "ticket-001.txt"
text = """
Ticket 001
Customer: Ana Silva
Product: Billing portal
Category: billing
Team: finance
Priority: urgent

Hello, I was charged twice for my March subscription. Could you refund one of the two charges?
"""
expect = { product = "Billing portal", category = "billing", team = "finance", customer = "Ana Silva", priority = "urgent" }


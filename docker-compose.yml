# `docker compose up` starts Postgres and then one full run of the system,
# and `docker compose run --rm lha --domain research` runs anything else.
# `docker compose up dashboard` serves the live dashboard on port 8000, and
# `just db-up` starts only Postgres, for running the code on the host.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lha
      POSTGRES_PASSWORD: lha
      POSTGRES_DB: lha
    ports:
      - "5433:5432"  # 5433 on the host, so it never clashes with another local Postgres
    command: ["postgres", "-c", "max_connections=300"]  # room for many workers (just scale)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lha"]
      interval: 2s
      retries: 15

  lha:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://lha:lha@db:5432/lha
    volumes:
      - ./runs:/app/runs  # finding.md and score.json of every run
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "lha.dashboard", "--host", "0.0.0.0"]
    command: []
    environment:
      DATABASE_URL: postgresql+asyncpg://lha:lha@db:5432/lha
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["dashboard"]  # only started when asked for, so `docker compose up` stays one run

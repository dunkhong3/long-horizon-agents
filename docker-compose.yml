# `docker compose up` starts Postgres and then one full run of the system,
# and `docker compose run --rm lha --domain research` runs anything else.
# `docker compose up dashboard` serves the live dashboard on port 8000, and
# `just db-up` starts only Postgres, for running the code on the host.
# `just up-join` plays a run on two machines with the 'join' profile, where
# the home container runs the coordinators and the mock world with no
# workers for the first two roles, and the helper container joins its run
# with workers of its own, so the run can only pass when the work crosses
# from one container to the other. The helper starts first and waits for
# the run, and the home runs with `docker compose run --use-aliases`, which
# keeps its service name for the helper to reach it by and gives back its
# exit code, while `up` would stop the home as soon as the helper is done.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lha
      POSTGRES_PASSWORD: lha
      POSTGRES_DB: lha
    ports:
      - "5433:5432"  # 5433 on the host, so it never clashes with another local Postgres
    command: ["postgres", "-c", "max_connections=300"]  # room for many workers (just scale)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lha"]
      interval: 2s
      retries: 15

  lha:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://lha:lha@db:5432/lha
      # A real model is used only when this key is set where compose runs
      # (see --model), and the fake one otherwise.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LHA_MODEL: ${LHA_MODEL:-auto}
    volumes:
      - ./runs:/app/runs  # finding.md and score.json of every run
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "lha.dashboard", "--host", "0.0.0.0"]
    command: []
    environment:
      DATABASE_URL: postgresql+asyncpg://lha:lha@db:5432/lha
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["dashboard"]  # only started when asked for, so `docker compose up` stays one run

  home:
    build: .
    command: ["--seed", "42", "--machine", "home", "--listen", "0.0.0.0", "--workers", "0,0"]
    environment:
      DATABASE_URL: postgresql+asyncpg://lha:lha@db:5432/lha
      LHA_ADVERTISE_HOST: home  # the helper reaches the mock world by this service's name
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LHA_MODEL: ${LHA_MODEL:-auto}
    volumes:
      - ./runs:/app/runs
    depends_on:
      db:
        condition: service_healthy
    profiles: ["join"]

  helper:
    build: .
    command: ["--join", "--wait", "120", "--machine", "helper", "--workers", "3,3"]
    environment:
      DATABASE_URL: postgresql+asyncpg://lha:lha@db:5432/lha
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LHA_MODEL: ${LHA_MODEL:-auto}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["join"]
